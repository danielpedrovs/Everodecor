name: Update Sitemap & Notify Search Engines

on:
  push:
    branches: [master]
    paths:
      - "blog/**.html"
      - "locations/**.html"
      - "index.html"
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for accurate lastmod + diffing

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit sitemap.xml if it changed
        id: commit
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: auto-update sitemap.xml"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sitemap.xml unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Bing with updated sitemap
        run: curl -s "https://www.bing.com/ping?sitemap=https://everodecor.uk/sitemap.xml"

      - name: Submit changed pages to IndexNow (Bing/Yandex/Seznam/Naver)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/submit-indexnow.js
